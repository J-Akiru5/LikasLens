  # =========================================================================
  # Admin - Eco-Credit Engine
  # =========================================================================

  /v1/likaslens-engine/credits/award:
    post:
      tags: [Admin-Bulk]
      summary: Award eco-credits
      description: Awards eco-credits to a user from a corporate ESG credit pool.
      operationId: awardCredits
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, ticket_id, credit_amount]
              properties:
                user_id:
                  type: string
                  format: uuid
                ticket_id:
                  type: string
                  format: uuid
                credit_amount:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Credits awarded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user_id:
                        type: string
                        format: uuid
                      awarded:
                        type: integer
                      new_balance:
                        type: integer
                      sponsored_by:
                        type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Ticket does not belong to user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Wallet or user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          description: Credit pools depleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

