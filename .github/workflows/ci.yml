# LikasLens Monorepo CI
#
# Policy: a check that cannot fail is not a check. Every job below is blocking
# unless its name says otherwise and the reason is written next to it.
#
# History: before the 2026-10 security remediation, all three frontend jobs and
# the AI-service job carried `continue-on-error: true` at both job and step
# level, and the AI-service job never ran pytest at all — only flake8 and an
# AST parse. That is why a production bug which made the pre-submission AI
# triage return "no concern" for every photo, and two failing tests, stayed
# invisible for roughly seven weeks. Do not reintroduce blanket
# continue-on-error.

name: CI

on:
  push:
    branches: [main, development]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "**.html"
      - ".github/dependabot.yml"
      - "ENEMY_ROADMAP/**"
  pull_request:
    branches: [main, development]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "**.html"
  workflow_call:
  workflow_dispatch:

env:
  PNPM_VERSION: 11
  NODE_VERSION: 22
  PYTHON_VERSION: "3.12"
  # Build-time placeholders only. No real project value is needed to compile,
  # and no secret is available to pull-request runs from forks anyway.
  NEXT_PUBLIC_SUPABASE_URL: "https://ci-placeholder.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"

jobs:
  # 1. Dependency consistency
  syncpack:
    name: SyncPack - dependency consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx syncpack lint

  # 2. Shared package
  shared-typecheck:
    name: Shared - typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @likaslens/shared typecheck
      - name: Unit tests
        run: pnpm --filter @likaslens/shared test

  # 3. Frontend
  frontend:
    name: Frontend - lint + typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # KNOWN DEBT, deliberately still advisory: `pnpm --filter frontend lint`
      # reports ~89 errors on the current tree. Making it blocking today would
      # turn main red immediately without fixing anything. It is tracked work;
      # remove this continue-on-error once those errors are cleared. Everything
      # else in this job is blocking.
      - name: Lint (advisory - known pre-existing debt)
        run: pnpm --filter frontend lint
        continue-on-error: true

      - name: TypeScript check
        run: pnpm --filter frontend typecheck

      # KNOWN DEBT, advisory for the same reason as lint: 3 of 16 vitest tests
      # fail on the current tree (an image-validation suite). Blocking them
      # today would make main red without fixing anything. Tracked work; drop
      # this continue-on-error when they pass.
      - name: Unit tests (advisory - 3 known pre-existing failures)
        run: pnpm --filter frontend test
        continue-on-error: true

      - name: Build
        run: pnpm --filter frontend build

  # 4. Mobile PWA — fully blocking.
  mobile-pwa:
    name: Mobile PWA - lint + typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter mobile-pwa lint
      - name: TypeScript check
        run: pnpm --filter mobile-pwa typecheck
      - name: Build
        run: pnpm --filter mobile-pwa build

  # 5. Admin Portal — fully blocking.
  admin-portal:
    name: Admin Portal - lint + typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter admin-portal lint
      - name: TypeScript check
        run: pnpm --filter admin-portal typecheck
      - name: Build
        run: pnpm --filter admin-portal build

  # 6. AI service — real tests, blocking.
  #
  # This job previously ran flake8 and an AST parse and never executed a single
  # test. It now runs the suite, including the triage-contract regression tests
  # that would have caught the `confidence=` / `confidence_threshold` bug.
  ai-service:
    name: AI Service - tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/ai-service/requirements.txt

      # CPU-only torch keeps the install small; the full CUDA wheel is ~2.5 GB
      # and CI has no GPU. Installed first so requirements.txt does not pull the
      # default build.
      - name: Install CPU-only torch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        timeout-minutes: 15

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-mock
        timeout-minutes: 20

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Lint (advisory - style only)
        run: python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

  # 7. Dependency advisory
  security-audit:
    name: Security audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Advisory by design: a new CVE in a transitive dependency must not block
      # an unrelated hotfix. Reviewed on a schedule, not per-commit.
      - name: pnpm audit
        run: pnpm audit --audit-level=high
        continue-on-error: true
