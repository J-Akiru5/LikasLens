name: "\U0001F680 Backend \u2013 Build & Deploy (GCP Cloud Run)"

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - ".github/workflows/gcp-backend-deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.sha }}
  cancel-in-progress: true

env:
  PROJECT_ID: likaslens
  REGION: asia-southeast1
  REPO_NAME: likaslens-repo
  SERVICE_NAME: likaslens-api

jobs:
  # ── CI Gate ─────────────────────────────────────────────────────────
  ci-gate:
    name: "\U0001F9EA CI Gate"
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ── Build + Scan + Deploy ──────────────────────────────────────────
  build-and-deploy:
    name: "\U0001F433 Build, Scan & Deploy"
    runs-on: ubuntu-latest
    needs: [ci-gate]
    permissions:
      id-token: write
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build container for security scan
        run: docker build -t likaslens-backend:scan apps/backend

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: likaslens-backend:scan
          format: sarif
          output: trivy-backend-results.sarif
          severity: HIGH,CRITICAL
          exit-code: 0
          vuln-type: os,library

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend-results.sarif
          category: backend-container

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker push
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          IMAGE_BASE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/likaslens-backend
          cd apps/backend
          docker build -t $IMAGE_BASE:${{ github.sha }} -t $IMAGE_BASE:latest .
          docker push $IMAGE_BASE:${{ github.sha }}
          docker push $IMAGE_BASE:latest

      - name: Deploy to Cloud Run
        run: |
          IMAGE_NAME=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/likaslens-backend:${{ github.sha }}
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image $IMAGE_NAME \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --quiet
