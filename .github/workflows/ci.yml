# ─────────────────────────────────────────────────────────────────────────────
# LikasLens Monorepo CI – 2026 Industry Standard
# Runs on every push to main/development and every PR.
# Uses path-based triggers so only affected apps are tested.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, development]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "**.html"
      - ".github/dependabot.yml"
      - "ENEMY_ROADMAP/**"
  pull_request:
    branches: [main, development]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "**.html"
  workflow_call: # allows deployment workflows to call this as a reusable workflow
  workflow_dispatch: # allow manual trigger

env:
  PNPM_VERSION: 10
  NODE_VERSION: 22
  PYTHON_VERSION: "3.12"

jobs:
  # ── 1. Dependency sync check (syncpack) ──────────────────────────────
  syncpack:
    name: 🔗 SyncPack – dependency consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check dependency mismatches
        run: npx syncpack list-mismatches

  # ── 2. Shared package typecheck ──────────────────────────────────────
  shared-typecheck:
    name: 📦 Shared – typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm --filter @likaslens/shared typecheck

  # ── 3. Frontend – lint + typecheck + build ──────────────────────────
  frontend:
    name: 🖥️ Frontend – lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter frontend lint
      - name: TypeScript check
        run: pnpm --filter frontend typecheck || npx tsc --noEmit -p apps/frontend/tsconfig.json
      - name: Build
        run: pnpm --filter frontend build

  # ── 4. Mobile PWA – lint + typecheck + build ────────────────────────
  mobile-pwa:
    name: 📱 Mobile PWA – lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter mobile-pwa lint
      - name: TypeScript check
        run: pnpm --filter mobile-pwa typecheck || npx tsc --noEmit -p apps/mobile-pwa/tsconfig.json
      - name: Build
        run: pnpm --filter mobile-pwa build

  # ── 5. Admin Portal – lint + typecheck + build ──────────────────────
  admin-portal:
    name: 🔐 Admin Portal – lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter admin-portal lint
      - name: TypeScript check
        run: pnpm --filter admin-portal typecheck || npx tsc --noEmit -p apps/admin-portal/tsconfig.json
      - name: Build
        run: pnpm --filter admin-portal build

  # ── 6. Backend (Laravel) – PHP lint + tests ─────────────────────────
  backend:
    name: ⚙️ Backend – PHP lint + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: likaslens_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_pgsql, pdo_mysql, zip, bcmath
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: apps/backend/vendor
          key: composer-${{ hashFiles('apps/backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Copy environment
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: PHP Syntax (Laravel Pint)
        run: ./vendor/bin/pint --test

      - name: Run tests
        run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: likaslens_test
          DB_USERNAME: test
          DB_PASSWORD: test

  # ── 7. AI Service (Python) – lint + syntax + import check ───────────
  ai-service:
    name: 🤖 AI Service – lint + imports
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/ai-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt flake8

      - name: Lint with flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check imports resolve
        run: python -c "import sys; sys.path.insert(0, '.'); from main import app; print('✓ All imports resolve OK')"

  # ── 8. Security audit ───────────────────────────────────────────────
  security-audit:
    name: 🛡️ Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: pnpm audit
        run: pnpm audit --audit-level=high
        continue-on-error: true # advisory-only; non-blocking

      - name: Composer audit
        working-directory: apps/backend
        run: composer audit || true
