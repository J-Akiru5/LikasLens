name: 🚀 Backend – Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - ".github/workflows/likaslens-backend-AutoDeployTrigger-*.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.sha }}
  cancel-in-progress: true

jobs:
  # ── CI Gate ─────────────────────────────────────────────────────────
  ci-gate:
    name: 🧪 CI Gate
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ── Build + Scan + Deploy ──────────────────────────────────────────
  build-and-deploy:
    name: 🐳 Build, Scan & Deploy
    runs-on: ubuntu-latest
    needs: [ci-gate]
    permissions:
      id-token: write
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        id: vars
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build container for security scan
        run: docker build -t likaslens-backend:scan apps/backend

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: likaslens-backend:scan
          format: sarif
          output: trivy-backend-results.sarif
          severity: HIGH,CRITICAL
          exit-code: 0
          vuln-type: os,library

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend-results.sarif
          category: backend-container

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.LIKASLENSBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.LIKASLENSBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.LIKASLENSBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/apps/backend
          registryUrl: ghcr.io
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GITHUB_TOKEN }}
          containerAppName: likaslens-backend
          resourceGroup: likaslens
          imageToBuild: ghcr.io/${{ steps.vars.outputs.owner }}/likaslens/likaslens-backend:${{ github.sha }}
