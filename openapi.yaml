  # =========================================================================

  /admin/tickets/bulk-status:
    post:
      tags: [Admin-Bulk]
      summary: Bulk ticket status change
      description: |
        Update status for up to 100 tickets at once. Validates status transitions
        per-ticket; failures are reported individually.
      operationId: adminBulkTicketStatus
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, status]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
                    format: uuid
                status:
                  type: string
                  enum: [open, investigating, monitoring, resolved, closed, verified]
      responses:
        "200":
          description: Bulk result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      updated:
                        type: integer
                      failed:
                        type: array
                        items:
                          type: string
                          format: uuid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

