  # -------------------------------------------------------------------------
  # Chat
  # -------------------------------------------------------------------------
  /v1/chat:
    post:
      tags: [Chat]
      summary: Likasy chatbot proxy
      description: |
        Proxies a chat request to the internal AI service. The AI service
        is not directly accessible from the browser; this backend bridges the gap.
        Rate limited to 10 requests/minute.
      operationId: sendChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role:
                        type: string
                        enum: [user, assistant]
                      content:
                        type: string
                system_prompt:
                  type: string
                  nullable: true
                temperature:
                  type: number
                  minimum: 0
                  maximum: 2
                  nullable: true
                max_output_tokens:
                  type: integer
                  minimum: 1
                  maximum: 8192
                  nullable: true
                top_p:
                  type: number
                  minimum: 0
                  maximum: 1
                  nullable: true
      responses:
        "200":
          description: Chat response
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: string
        "502":
          description: AI service unreachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: string

