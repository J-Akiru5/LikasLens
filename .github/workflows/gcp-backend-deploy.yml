name: "\U0001F680 Backend \u2013 Build & Deploy (GCP Cloud Run)"

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - ".github/workflows/gcp-backend-deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.sha }}
  cancel-in-progress: true

env:
  PROJECT_ID: likaslens
  REGION: asia-southeast1
  REPO_NAME: likaslens-repo
  SERVICE_NAME: likaslens-api

jobs:
  # ── CI Gate ─────────────────────────────────────────────────────────
  ci-gate:
    name: "\U0001F9EA CI Gate"
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ── Build + Scan + Deploy ──────────────────────────────────────────
  build-and-deploy:
    name: "\U0001F433 Build, Scan & Deploy"
    runs-on: ubuntu-latest
    needs: [ci-gate]
    permissions:
      id-token: write
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"

      - name: Build container for security scan
        run: docker build -t likaslens-backend:scan apps/backend

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: likaslens-backend:scan
          format: sarif
          output: trivy-backend-results.sarif
          severity: HIGH,CRITICAL
          exit-code: 0
          vuln-type: os,library

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend-results.sarif
          category: backend-container

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker push
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          IMAGE_BASE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/likaslens-backend
          cd apps/backend
          docker build -t $IMAGE_BASE:${{ github.sha }} -t $IMAGE_BASE:latest .
          docker push $IMAGE_BASE:${{ github.sha }}
          docker push $IMAGE_BASE:latest

      - name: Deploy to Cloud Run
        run: |
          IMAGE_NAME=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/likaslens-backend:${{ github.sha }}
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image $IMAGE_NAME \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --set-env-vars="APP_KEY=${{ secrets.APP_KEY }},APP_ENV=local,APP_DEBUG=true,APP_URL=https://${{ env.SERVICE_NAME }}-1096292232709.${{ env.REGION }}.run.app,DB_CONNECTION=pgsql,DB_HOST=${{ secrets.DB_HOST }},DB_PORT=${{ secrets.DB_PORT }},DB_DATABASE=postgres,DB_USERNAME=${{ secrets.DB_USERNAME }},DB_PASSWORD=${{ secrets.DB_PASSWORD }},SANCTUM_STATEFUL_DOMAINS=likaslens.syntaxure.dev,SESSION_DRIVER=database,QUEUE_CONNECTION=database,CACHE_STORE=database,LOG_LEVEL=error,NEXT_PUBLIC_SUPABASE_URL=https://sfklmmtimelotqvrldni.supabase.co,SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }},SUPABASE_S3_ENDPOINT=https://sfklmmtimelotqvrldni.storage.supabase.co/storage/v1/s3,SUPABASE_S3_ACCESS_KEY=${{ secrets.SUPABASE_S3_ACCESS_KEY }},SUPABASE_S3_SECRET_KEY=${{ secrets.SUPABASE_S3_SECRET_KEY }},SUPABASE_S3_REGION=ap-northeast-2,SUPABASE_STORAGE_BUCKET=likaslens-evidence,AI_SERVICE_URL=https://likaslens-ai-1096292232709.asia-southeast1.run.app" \
            --quiet
