openapi: 3.0.3
info:
  title: LikasLens API
  description: |
    LikasLens AI Environmental Detection Platform API.

    This is the **sole contract** governing inter-service communication between
    frontend, mobile-pwa, admin-portal, backend, and ai-service — as mandated by
    the AGENTS.md architectural boundary rules.

    All endpoints return JSON. Public endpoints are rate-limited per IP.
    Authenticated endpoints require a Sanctum Bearer token issued via
    `/auth/sync`, `/auth/login`, or `/auth/register`.
  version: 1.0.0
  contact:
    name: LikasLens Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8000/api
    description: Local development (Backend)
  - url: https://api.likaslens.com/api
    description: Production (Backend)
  - url: http://localhost:8001
    description: Local development (AI Service)
  - url: https://ai.likaslens.com
    description: Production (AI Service)

tags:
  - name: Health
    description: Service health checks
  - name: AI Service
    description: AI inference and detection service
  - name: Auth
    description: Authentication and user sync
  - name: Reports
    description: Environmental report submission and triage
  - name: Tickets
    description: Public ticket tracking
  - name: Laws
    description: Environmental laws reference data
  - name: Leaderboard
    description: Gamification leaderboards and stats
  - name: Achievements
    description: Achievement catalog
  - name: NGOs
    description: NGO partner directory
  - name: Dashboard
    description: Public dashboard stats and activity feed
  - name: Impact
    description: Aggregate impact statistics
  - name: Map
    description: Heatmap and geographic data
  - name: Profile
    description: Public profile viewing
  - name: User
    description: Authenticated user endpoints
  - name: Chat
    description: AI chatbot proxy
  - name: Admin-Users
    description: Admin user management
  - name: Admin-NGOs
    description: Admin NGO management
  - name: Admin-Laws
    description: Admin law management
  - name: Admin-Rewards
    description: Admin reward management
  - name: Admin-AuditLogs
    description: Admin audit log viewing
  - name: Admin-Triage
    description: Admin triage queue management
  - name: Admin-LGU
    description: Admin LGU performance metrics
  - name: Admin-Predictions
    description: Admin predictive hotspot detection
  - name: Admin-Bulk
    description: Admin bulk operations
  - name: Admin-ContactMessages
    description: Admin contact message management

# ---------------------------------------------------------------------------
# Security Schemes
# ---------------------------------------------------------------------------
security: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Supabase-issued JWT token. Obtain via `/auth/sync` (Supabase identity),
        `/auth/login` (email/password), or `/auth/register`.

    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: PAT
      description: |
        Personal Access Token issued via the Admin Portal for Public API access.

  # ---------------------------------------------------------------------------
  # Reusable Schemas
  # ---------------------------------------------------------------------------
  schemas:

    # -- Generic Wrappers --
    ApiResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          description: Varies per endpoint

    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Validation error"
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        last_page:
          type: integer
          example: 5
        per_page:
          type: integer
          example: 20
        total:
          type: integer
          example: 100

    # -- Core Domain Models --
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        supabase_auth_user_id:
          type: string
          nullable: true
        name:
          type: string
        email:
          type: string
          format: email
        country_code:
          type: string
          nullable: true
          example: "PH"
        role:
          $ref: "#/components/schemas/Role"
        trust_score:
          type: integer
          example: 100
        reward_points_balance:
          type: integer
          example: 250
        created_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true

    Role:
      type: string
      enum:
        - citizen
        - ghost
        - lgu
        - partner
        - analyst
        - super_admin

    Ticket:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_id:
          type: string
          example: "INC-A1B2C3"
        title:
          type: string
        description:
          type: string
        location:
          type: string
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        status:
          $ref: "#/components/schemas/TicketStatus"
        urgency_score:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10
        category:
          type: string
          nullable: true
        reporter:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true

    TicketStatus:
      type: string
      enum:
        - open
        - investigating
        - monitoring
        - resolved
        - closed
        - pending_review
        - verified

    TicketDetail:
      allOf:
        - $ref: "#/components/schemas/Ticket"
        - type: object
          properties:
            address_text:
              type: string
              nullable: true
            ai_triage_summary:
              type: string
              nullable: true
            ai_confidence:
              type: number
              format: float
              nullable: true
            evidence:
              type: array
              items:
                $ref: "#/components/schemas/TicketEvidence"
            classifications:
              type: array
              items:
                $ref: "#/components/schemas/TicketClassification"
            assignments:
              type: array
              items:
                $ref: "#/components/schemas/TicketAssignment"

    TicketEvidence:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ticket_id:
          type: string
          format: uuid
        uploaded_by_user_id:
          type: string
          format: uuid
          nullable: true
        storage_path:
          type: string
        mime_type:
          type: string
        file_size_bytes:
          type: integer
        checksum_sha256:
          type: string
        yolo_status:
          type: string
          enum: [pending, processed, failed]
        captured_at:
          type: string
          format: date-time
          nullable: true
        exif_removed_at:
          type: string
          format: date-time
          nullable: true
        uploaded_by:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string

    TicketClassification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ticket_id:
          type: string
          format: uuid
        violation_type_id:
          type: string
          format: uuid
        violation_type:
          type: string
          nullable: true
        classified_by:
          type: string
        confidence_score:
          type: number
          format: float
          nullable: true

    TicketAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ticket_id:
          type: string
          format: uuid
        assigned_group_id:
          type: string
          format: uuid
        assigned_by_user_id:
          type: string
          format: uuid
        status:
          type: string
        assignment_reason:
          type: string
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        ngo_group:
          $ref: "#/components/schemas/Ngo"
        assigned_by:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string

    TicketTimelineEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        from_status:
          type: string
          nullable: true
        to_status:
          type: string
        transition_label:
          type: string
          nullable: true
        actor_type:
          type: string
        note:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
        created_at:
          type: string
          format: date-time
        actor:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            role:
              $ref: "#/components/schemas/Role"

    Report:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          nullable: true
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        image_path:
          type: string
          nullable: true
        image_size:
          type: integer
          nullable: true
        storage_disk:
          type: string
          nullable: true
        status:
          type: string
        evidence_hash:
          type: string
          nullable: true
        blockchain_tx:
          type: string
          nullable: true
        blockchain_verified_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    Law:
      type: object
      properties:
        id:
          type: string
          format: uuid
        law_code:
          type: string
          example: "RA-9275"
        country_code:
          type: string
          example: "PH"
        title:
          type: string
        summary:
          type: string
        issuing_agency:
          type: string
        jurisdiction_scope:
          type: string
          nullable: true
        source_url:
          type: string
          format: uri
          nullable: true
        is_active:
          type: boolean
        penalties:
          type: array
          items:
            $ref: "#/components/schemas/LawPenalty"
        violation_types:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              code:
                type: string
              name:
                type: string
              description:
                type: string
                nullable: true

    LawPenalty:
      type: object
      properties:
        id:
          type: string
          format: uuid
        law_id:
          type: string
          format: uuid
        violation_name:
          type: string
        penalty_type:
          type: string
        min_fine_php:
          type: number
          format: double
          nullable: true
        max_fine_php:
          type: number
          format: double
          nullable: true
        min_imprisonment_days:
          type: integer
          nullable: true
        max_imprisonment_days:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true

    Ngo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        focus_area:
          type: string
          nullable: true
        region:
          type: string
        province:
          type: string
          nullable: true
        city_municipality:
          type: string
          nullable: true
        contact_email:
          type: string
          format: email
          nullable: true
        contact_phone:
          type: string
          nullable: true
        contact_number:
          type: string
          nullable: true
        is_active:
          type: boolean
        is_verified:
          type: boolean
        created_at:
          type: string
          format: date-time

    Reward:
      type: object
      properties:
        id:
          type: string
          format: uuid
        partner_store_id:
          type: string
          format: uuid
        reward_name:
          type: string
        reward_type:
          type: string
        points_cost:
          type: integer
        stock_quantity:
          type: integer
        valid_from:
          type: string
          format: date-time
          nullable: true
        valid_until:
          type: string
          format: date-time
          nullable: true
        is_active:
          type: boolean
        partner_store:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string

    Achievement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        criteria_type:
          type: string
        criteria_value:
          type: object
          nullable: true
        icon:
          type: string
        tier:
          $ref: "#/components/schemas/AchievementTier"
        points_awarded:
          type: integer
        is_hidden:
          type: boolean
        sort_order:
          type: integer
        unlocked:
          type: boolean
          description: Only present in user-context responses
        progress_value:
          type: integer
          description: Only present in user-context responses
        threshold:
          type: integer
          description: Only present in user-context responses
        unlocked_at:
          type: string
          format: date-time
          nullable: true

    AchievementTier:
      type: string
      enum:
        - basic
        - verified
        - advanced
        - authority

    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actor_user_id:
          type: string
          format: uuid
        action:
          type: string
        entity_type:
          type: string
        entity_id:
          type: string
          format: uuid
        old_values:
          type: object
          nullable: true
        new_values:
          type: object
          nullable: true
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        request_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        actor:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            role:
              $ref: "#/components/schemas/Role"

    RankProgress:
      type: object
      properties:
        current_level:
          type: string
        level_number:
          type: integer
        current_xp:
          type: integer
        xp_to_next_level:
          type: integer
        next_level:
          type: string
          nullable: true
        next_level_xp:
          type: integer
          nullable: true
        progress_percent:
          type: number
          format: float
        eco_credit_bonus:
          type: integer

    DashboardStats:
      type: object
      properties:
        active_incidents:
          type: integer
        active_incidents_total:
          type: integer
        active_incidents_progress:
          type: integer
        active_incidents_trend:
          type: string
        resolved_today:
          type: integer
        resolved_today_total:
          type: integer
        resolved_today_progress:
          type: integer
        resolved_today_trend:
          type: string
        avg_response_minutes:
          type: number
          format: float
        avg_response_sla:
          type: integer
        avg_response_progress:
          type: integer
        avg_response_trend:
          type: string
        system_load:
          type: integer
        system_load_total:
          type: integer
        system_load_progress:
          type: integer
        system_load_trend:
          type: string
        total_tickets:
          type: integer
        total_reports:
          type: integer
        total_users:
          type: integer
        ghost_reports:
          type: integer
        tickets_by_status:
          type: object
          additionalProperties:
            type: integer

    ActivityFeedItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_id:
          type: string
          example: "INC-A1B2C3"
        type:
          type: string
          enum: [Critical, Warning, Info]
        title:
          type: string
        description:
          type: string
        location:
          type: string
        time:
          type: string
          description: Human-readable relative time
        status:
          type: string
        reporter:
          type: string

    PublicImpactData:
      type: object
      properties:
        total_reports:
          type: integer
        total_resolved:
          type: integer
        total_citizens:
          type: integer
        total_ngos:
          type: integer
        resolution_rate:
          type: number
          format: float
        recent_verified:
          type: array
          items:
            $ref: "#/components/schemas/VerifiedReport"
        reports_by_type:
          type: object
          additionalProperties:
            type: integer
        top_barangays:
          type: array
          items:
            $ref: "#/components/schemas/TopBarangay"

    VerifiedReport:
      type: object
      properties:
        location:
          type: string
        status:
          type: string
        date:
          type: string
          format: date
        title:
          type: string

    TopBarangay:
      type: object
      properties:
        name:
          type: string
        count:
          type: integer

    HeatmapData:
      type: object
      properties:
        points:
          type: array
          items:
            $ref: "#/components/schemas/HeatmapPoint"
        clusters:
          type: array
          items:
            $ref: "#/components/schemas/HeatmapCluster"
        hot_zones:
          type: array
          items:
            $ref: "#/components/schemas/HotZone"

    HeatmapPoint:
      type: object
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        weight:
          type: integer
        type:
          type: string
        urgency_score:
          type: integer
          nullable: true

    HeatmapCluster:
      type: object
      properties:
        center_lat:
          type: number
          format: double
        center_lng:
          type: number
          format: double
        count:
          type: integer
        location:
          type: string
        dominant_type:
          type: string

    HotZone:
      type: object
      properties:
        bounds:
          type: object
          properties:
            south:
              type: number
              format: double
            west:
              type: number
              format: double
            north:
              type: number
              format: double
            east:
              type: number
              format: double
        report_count:
          type: integer
        dominant_type:
          type: string
        urgency:
          type: string
          enum: [critical, high, medium, low]
        location:
          type: string

    ViolationType:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true

    LeaderboardEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        eco_credits:
          type: integer
        score:
          type: integer
        level:
          type: string
        level_number:
          type: integer
        report_count:
          type: integer

    BarangayLeaderboardEntry:
      type: object
      properties:
        barangay:
          type: string
        report_count:
          type: integer

    SpotlightUser:
      type: object
      nullable: true
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        eco_credits:
          type: integer
        total_balance:
          type: integer
        level:
          type: string
        level_number:
          type: integer
        report_count:
          type: integer

    LeaderboardStats:
      type: object
      properties:
        total_reports:
          type: integer
        total_citizens:
          type: integer
        avg_eco_credits:
          type: integer

    UserImpact:
      type: object
      properties:
        eco_credits:
          type: integer
        trust_score:
          type: integer
        community_rank:
          type: integer
        total_reports:
          type: integer
        total_citizens:
          type: integer
        rank_progress:
          $ref: "#/components/schemas/RankProgress"
        recent_achievements:
          type: array
          items:
            $ref: "#/components/schemas/RecentAchievement"
        reports:
          type: array
          items:
            $ref: "#/components/schemas/CitizenReport"

    RecentAchievement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        icon:
          type: string
        tier:
          $ref: "#/components/schemas/AchievementTier"
        description:
          type: string
        unlocked_at:
          type: string
          format: date-time

    CitizenReport:
      type: object
      properties:
        id:
          type: string
          format: uuid
        image_path:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        status:
          type: string
        created_at:
          type: string
          format: date-time

    LguPerformanceData:
      type: object
      properties:
        lgus:
          type: array
          items:
            $ref: "#/components/schemas/LguPerformanceRow"
        platform_averages:
          $ref: "#/components/schemas/LguPlatformAverages"

    LguPerformanceRow:
      type: object
      properties:
        lgu_id:
          type: string
          format: uuid
        lgu_name:
          type: string
        region:
          type: string
          nullable: true
        is_active:
          type: boolean
        total_assigned:
          type: integer
        total_resolved:
          type: integer
        resolution_rate:
          type: number
          format: float
        avg_response_hours:
          type: number
          format: float
        avg_resolution_hours:
          type: number
          format: float
        sla_compliance_rate:
          type: number
          format: float
        pending_count:
          type: integer
        breached_count:
          type: integer
        status:
          type: string
          enum: [green, amber, red]

    LguPlatformAverages:
      type: object
      properties:
        total_lgus:
          type: integer
        avg_resolution_rate:
          type: number
          format: float
        avg_response_hours:
          type: number
          format: float
        avg_resolution_hours:
          type: number
          format: float
        sla_compliance_rate:
          type: number
          format: float
        total_assigned:
          type: integer
        total_resolved:
          type: integer

    TriageTicket:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_id:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
        ai_confidence:
          type: number
          format: float
          nullable: true
        ai_triage_summary:
          type: string
          nullable: true
        urgency_score:
          type: integer
          nullable: true
        location:
          type: string
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        photo_url:
          type: string
          nullable: true
        photo_mime:
          type: string
          nullable: true
        classifications:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              violation_type:
                type: string
              confidence:
                type: number
                format: float
                nullable: true
        reporter:
          type: string
        created_at:
          type: string
          format: date-time
        time_since:
          type: string

    Prediction:
      type: object
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        location_name:
          type: string
        violation_type:
          type: string
        risk_score:
          type: number
          format: float
        predicted_reports:
          type: integer
        confidence:
          type: number
          format: float

    ContactMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        message:
          type: string
        status:
          type: string
          enum: [unread, read]
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: Notification class name
        data:
          type: object
          properties:
            ticket_id:
              type: string
              format: uuid
              nullable: true
            from_status:
              type: string
              nullable: true
            to_status:
              type: string
              nullable: true
            message:
              type: string
              nullable: true
            response_breached:
              type: boolean
              nullable: true
            resolution_breached:
              type: boolean
              nullable: true
            escalated_at:
              type: string
              format: date-time
              nullable: true
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        unread_count:
          type: integer
          nullable: true

    BlockchainVerification:
      type: object
      properties:
        report_id:
          type: string
          format: uuid
        evidence_hash:
          type: string
        tx_hash:
          type: string
          nullable: true
        explorer_url:
          type: string
          format: uri
          nullable: true
        on_chain_verified:
          type: boolean
        verified_at:
          type: string
          format: date-time
          nullable: true

    CurrencySetting:
      type: object
      properties:
        id:
          type: string
          format: uuid
        country_code:
          type: string
        country_name:
          type: string
        currency_code:
          type: string
        currency_name:
          type: string
        eco_credit_rate:
          type: number
          format: float
        is_active:
          type: boolean

# ===========================================================================
# PATHS
# ===========================================================================
paths:

  # -------------------------------------------------------------------------
  # Public API (External Developers)
  # -------------------------------------------------------------------------
  /public/v1/reports:
    get:
      tags: [Public-API]
      summary: Retrieve public reports
      description: Returns a paginated list of public, verified environmental reports.
      operationId: getPublicReports
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: per_page
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: A list of reports
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Report"
                      meta:
                        $ref: "#/components/schemas/PaginationMeta"

  # -------------------------------------------------------------------------
  # Health
  # -------------------------------------------------------------------------
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Returns service status. No authentication required.
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  service:
                    type: string
                    example: "likaslens-backend"
                  timestamp:
                    type: string
                    format: date-time

  # -------------------------------------------------------------------------
  # AI Service — Roboflow
  # -------------------------------------------------------------------------
  /roboflow/health:
    get:
      tags: [AI Service]
      summary: Roboflow pipeline health check
      description: |
        Verifies connectivity to the Roboflow Serverless API.
        Requires API key authentication via `X-API-Key` header.
        Returns connection status and model information.
      operationId: getRoboflowHealth
      security:
        - apiKey: []
      responses:
        "200":
          description: Roboflow connectivity status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, error]
                    example: "ok"
                  model:
                    type: string
                    example: "garbage-detection-sht1u/4"
                  roboflow_connected:
                    type: boolean
                    example: true
                  http_status:
                    type: integer
                    example: 200
                required: [status, model, roboflow_connected]
              examples:
                success:
                  summary: Roboflow is reachable
                  value:
                    status: "ok"
                    model: "garbage-detection-sht1u/4"
                    roboflow_connected: true
                    http_status: 200
                auth_error:
                  summary: Invalid API key
                  value:
                    status: "error"
                    model: "garbage-detection-sht1u/4"
                    roboflow_connected: false
                    error: "Invalid API key (401 Unauthorized)"
                connection_error:
                  summary: Cannot reach Roboflow
                  value:
                    status: "error"
                    model: "garbage-detection-sht1u/4"
                    roboflow_connected: false
                    error: "Cannot reach Roboflow API (connection refused or DNS failure)"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # -------------------------------------------------------------------------
  # Auth
  # -------------------------------------------------------------------------
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: Creates a new citizen account and returns a Sanctum token.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                supabase_auth_user_id:
                  type: string
                  description: Optional Supabase identity UUID
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
                      token:
                        type: string
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
                      token:
                        type: string
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/sync:
    post:
      tags: [Auth]
      summary: Sync Supabase identity
      description: |
        Creates or updates a local user record from a Supabase Auth identity.
        Used by the frontend/mobile-pwa after Supabase OAuth or magic-link flows.
        Returns a Sanctum token for subsequent API calls.
      operationId: authSync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supabase_auth_user_id, email]
              properties:
                supabase_auth_user_id:
                  type: string
                  description: Supabase Auth user UUID
                email:
                  type: string
                  format: email
                name:
                  type: string
                  maxLength: 255
                  nullable: true
      responses:
        "200":
          description: User synced successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
                      token:
                        type: string
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh authentication token
      description: Revokes the current token and issues a fresh one with 24-hour expiry.
      operationId: authRefresh
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      token:
                        type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      description: Revokes the current Sanctum token.
      operationId: authLogout
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  # -------------------------------------------------------------------------
  # Reports
  # -------------------------------------------------------------------------
  /reports:
    post:
      tags: [Reports]
      summary: Submit an environmental report
      description: |
        Creates a new ticket, evidence record, and report from a base64-encoded
        image. The image is EXIF-stripped server-side (Ghost Mode). AI triage,
        blockchain evidence hashing, and similarity checks run asynchronously
        after creation.

        Rate limited to 10 requests/minute per IP.
      operationId: submitReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base64Image, latitude, longitude]
              properties:
                base64Image:
                  type: string
                  description: Base64-encoded image (may include data: URI prefix)
                latitude:
                  type: number
                  format: double
                longitude:
                  type: number
                  format: double
                user_id:
                  type: string
                  description: Supabase Auth user ID. Omit or send "ANONYMOUS_GHOST" for ghost mode.
                  nullable: true
                description:
                  type: string
                  maxLength: 5000
                  nullable: true
                report_type:
                  type: string
                  maxLength: 100
                  description: "One of: illegal_logging, water_pollution, illegal_fishing, waste_dumping, wildlife_poaching, mining_violation, air_pollution, land_encroachment, other"
                  nullable: true
      responses:
        "201":
          description: Report submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      ticket_id:
                        type: string
                        format: uuid
                      evidence_id:
                        type: string
                        format: uuid
                      latitude:
                        type: number
                      longitude:
                        type: number
                      imageSize:
                        type: integer
                      checksum:
                        type: string
                      triage:
                        type: object
                        properties:
                          success:
                            type: boolean
                          has_concern:
                            type: boolean
                          indicators:
                            type: array
                            items:
                              type: object
                      blockchain:
                        type: object
                        properties:
                          evidence_hash:
                            type: string
                            nullable: true
                          tx_hash:
                            type: string
                            nullable: true
                          explorer_url:
                            type: string
                            nullable: true
                          verified_at:
                            type: string
                            format: date-time
                            nullable: true
                      chain:
                        type: object
                        nullable: true
                        properties:
                          chain_id:
                            type: string
                            format: uuid
                          is_new_chain:
                            type: boolean
                          total_reports:
                            type: integer
                          urgency_boost:
                            type: integer
                      similar_reports:
                        type: array
                        items:
                          type: object
                      similar_reports_message:
                        type: string
                        nullable: true
        "422":
          description: Invalid image data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Processing failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reports/triage:
    post:
      tags: [Reports]
      summary: AI triage only (no storage)
      description: |
        Sends an image to the AI triage service and returns the analysis
        without creating any database records. Useful for pre-submission checks.
        Rate limited to 20 requests/minute.
      operationId: triageReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base64Image]
              properties:
                base64Image:
                  type: string
      responses:
        "200":
          description: Triage result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  has_concern:
                    type: boolean
                  indicators:
                    type: array
                    items:
                      type: object
        "500":
          description: Triage failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reports/chain/{chainId}:
    get:
      tags: [Reports]
      summary: Get report chain details
      description: Returns details of a report chain including all linked tickets.
      operationId: getReportChain
      parameters:
        - name: chainId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Chain details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      chain_id:
                        type: string
                        format: uuid
                      primary_ticket_id:
                        type: string
                        format: uuid
                      location_name:
                        type: string
                        nullable: true
                      latitude:
                        type: number
                        format: double
                        nullable: true
                      longitude:
                        type: number
                        format: double
                        nullable: true
                      radius_meters:
                        type: integer
                        nullable: true
                      total_reports:
                        type: integer
                      urgency_boost:
                        type: integer
                      first_reported_at:
                        type: string
                        format: date-time
                        nullable: true
                      last_reported_at:
                        type: string
                        format: date-time
                        nullable: true
                      status:
                        type: string
                      tickets:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            title:
                              type: string
                            status:
                              type: string
                            urgency_score:
                              type: integer
                              nullable: true
                            created_at:
                              type: string
                              format: date-time
        "404":
          $ref: "#/components/responses/NotFound"

  /reports/{id}/verify-evidence:
    get:
      tags: [Reports]
      summary: Verify blockchain evidence
      description: |
        Returns blockchain evidence verification status for a report.
        Rate limited to 30 requests/minute.
      operationId: verifyEvidence
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/BlockchainVerification"
        "404":
          description: Report not found or no blockchain evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reports/verify:
    post:
      tags: [Reports]
      summary: LGU-verify a report
      description: Marks a report as verified by an LGU analyst. Requires analyst or super_admin role.
      operationId: verifyReport
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [report_id]
              properties:
                report_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Report verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      report_id:
                        type: string
                        format: uuid
                      status:
                        type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /reports/batch-sync:
    post:
      tags: [Reports]
      summary: Batch sync offline reports
      description: |
        Accepts an array of queued offline reports (max 50) and processes each
        as an individual report submission.
      operationId: batchSyncReports
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reports]
              properties:
                reports:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [base64Image, latitude, longitude]
                    properties:
                      base64Image:
                        type: string
                      latitude:
                        type: number
                        format: double
                      longitude:
                        type: number
                        format: double
                      user_id:
                        type: string
                        nullable: true
                      description:
                        type: string
                        maxLength: 5000
                        nullable: true
                      report_type:
                        type: string
                        maxLength: 100
                        nullable: true
      responses:
        "200":
          description: Batch sync result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      synced:
                        type: integer
                      total:
                        type: integer
                      results:
                        type: array
                        items:
                          type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  # -------------------------------------------------------------------------
  # Heatmap / Map
  # -------------------------------------------------------------------------
  /reports/heatmap:
    get:
      tags: [Map]
      summary: Get heatmap data
      description: |
        Returns GeoJSON-like heatmap data with individual points, spatial
        clusters (within 100m), and hot zones (5+ reports in 7 days).
        Rate limited to 60 requests/minute.
      operationId: getHeatmap
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
          description: Lookback window in days
        - name: type
          in: query
          schema:
            type: string
          description: Violation type code filter
        - name: bounds
          in: query
          schema:
            type: string
          description: "Map viewport bounds as: south,west,north,east"
      responses:
        "200":
          description: Heatmap data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/HeatmapData"

  /reports/heatmap/violation-types:
    get:
      tags: [Map]
      summary: Get available violation types
      description: Returns violation type codes for the heatmap filter dropdown. Cached for 1 hour.
      operationId: getViolationTypes
      responses:
        "200":
          description: Violation types list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        name:
                          type: string

  # -------------------------------------------------------------------------
  # Tickets
  # -------------------------------------------------------------------------
  /tickets:
    get:
      tags: [Tickets]
      summary: List tickets (public, paginated)
      description: Returns a paginated list of tickets. Rate limited to 60 req/min.
      operationId: listTickets
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search in title, description, address, status
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TicketStatus"
        - name: per_page
          in: query
          schema:
            type: integer
            maximum: 50
            default: 20
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: Paginated ticket list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Ticket"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"

  /tickets/{id}:
    get:
      tags: [Tickets]
      summary: Get ticket detail
      description: Returns full ticket detail including evidence, classifications, and assignments.
      operationId: getTicket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Ticket detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/TicketDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /tickets/{id}/timeline:
    get:
      tags: [Tickets]
      summary: Get ticket status timeline
      description: |
        Returns the full status transition timeline for a ticket.
        Ghost-mode safe: reporter identity is never exposed.
      operationId: getTicketTimeline
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Timeline data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      ticket_id:
                        type: string
                        format: uuid
                      display_id:
                        type: string
                      timeline:
                        type: array
                        items:
                          $ref: "#/components/schemas/TicketTimelineEntry"
        "404":
          $ref: "#/components/responses/NotFound"

  /tickets/{id}/status:
    patch:
      tags: [Tickets]
      summary: Update ticket status
      description: |
        Transition a ticket to a new status. Validates allowed transitions.
        Requires analyst or super_admin role.
      operationId: updateTicketStatus
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: "#/components/schemas/TicketStatus"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      old_status:
                        type: string
                      new_status:
                        type: string
                      resolved_at:
                        type: string
                        format: date-time
                        nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # -------------------------------------------------------------------------
  # Laws
  # -------------------------------------------------------------------------
  /laws:
    get:
      tags: [Laws]
      summary: List environmental laws
      description: Paginated list of environmental laws with penalties and violation types.
      operationId: listLaws
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search in title, summary, law_code
        - name: active_only
          in: query
          schema:
            type: boolean
            default: false
        - name: per_page
          in: query
          schema:
            type: integer
            maximum: 50
            default: 20
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: Paginated law list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Law"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"

  /laws/{id}:
    get:
      tags: [Laws]
      summary: Get law detail
