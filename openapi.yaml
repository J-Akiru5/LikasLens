    post:
      tags: [Admin-Bulk]
      summary: Bulk ticket assignment
      description: Assign up to 100 tickets to an NGO/LGU at once.
      operationId: adminBulkTicketAssign
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, lgu_id]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
                    format: uuid
                lgu_id:
                  type: string
                  format: uuid
                  description: NGO group ID to assign tickets to
      responses:
        "200":
          description: Bulk result
          content:
            application/json:
              schema:
                type: object
