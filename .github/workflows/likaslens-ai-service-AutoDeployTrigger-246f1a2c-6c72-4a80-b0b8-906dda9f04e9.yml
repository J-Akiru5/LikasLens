name: 🚀 AI Service – Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/ai-service/**"
      - ".github/workflows/likaslens-ai-service-AutoDeployTrigger-*.yml"
  workflow_dispatch:

concurrency:
  group: deploy-ai-service-${{ github.sha }}
  cancel-in-progress: true

jobs:
  # ── CI Gate: run AI service checks first ────────────────────────────
  ci-gate:
    name: 🧪 CI Gate
    uses: ./.github/workflows/ci.yml
    # We reference the ai-service job implicitly; GitHub matches the job
    # by the workflow call — but we just use this as a lightweight call
    secrets: inherit

  # ── Build + Scan + Deploy ──────────────────────────────────────────
  build-and-deploy:
    name: 🐳 Build & Deploy
    runs-on: ubuntu-latest
    needs: [ci-gate]
    permissions:
      id-token: write
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        id: vars
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build container for security scan
        run: docker build -t likaslens-ai-service:scan apps/ai-service

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.29.0
        with:
          image-ref: likaslens-ai-service:scan
          format: sarif
          output: trivy-ai-results.sarif
          severity: HIGH,CRITICAL
          exit-code: 1
          vuln-type: os,library

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-ai-results.sarif
          category: ai-service-container

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.LIKASLENSAISERVICE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.LIKASLENSAISERVICE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.LIKASLENSAISERVICE_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/apps/ai-service
          registryUrl: ghcr.io
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GITHUB_TOKEN }}
          containerAppName: likaslens-ai-service
          resourceGroup: likaslens
          imageToBuild: ghcr.io/${{ steps.vars.outputs.owner }}/likaslens/likaslens-ai-service:${{ github.sha }}
